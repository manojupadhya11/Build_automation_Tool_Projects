spring.application.name=DevOps Shack ProjectOps API
server.port=${SERVER_PORT:8080}

# Native/local defaults: MySQL runs on the same machine.
# Override DB_URL/DB_USERNAME/DB_PASSWORD only when the DB is hosted elsewhere.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/projectops?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:projectops}
spring.datasource.password=${DB_PASSWORD:projectops123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# The default frontend path is same-origin (/api through Vite/Nginx), so CORS is
# normally not involved. This remains configurable for intentionally separate origins.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}
server.error.include-message=always
