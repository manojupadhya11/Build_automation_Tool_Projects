services:
  mysql:
    image: mysql:8.4
    container_name: projectops-mysql
    environment:
      MYSQL_DATABASE: projectops
      MYSQL_USER: projectops
      MYSQL_PASSWORD: projectops123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - projectops_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: projectops-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/projectops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: projectops
      DB_PASSWORD: projectops123
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: projectops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  projectops_mysql_data:
